<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikeErg · Frirull</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b22;color:#edf2df;font:16px system-ui}header{padding:32px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{margin:0;font-size:24px}small{color:#a8b7b5}main{margin:0 5vw}canvas{display:block;width:100%;height:55vh;border-radius:24px;background:#213442}.stats{display:flex;gap:48px;margin:30px 0}.stats b{display:block;font-size:36px;font-variant-numeric:tabular-nums}button{background:#c9ed8a;color:#152027;border:0;padding:12px 20px;border-radius:12px;cursor:pointer}footer{color:#a8b7b5;line-height:1.8}#status{color:#c9ed8a}
</style><header><div><small>BIKEERG / FÖRSTA SPELPROTOTYPEN</small><h1>Frirull</h1></div><span id="status">Ansluter…</span></header><main><canvas id="scene"></canvas><div class="stats"><div><small>EFFEKT</small><b id="watts">—</b></div><div><small>KADENS</small><b id="rpm">—</b></div><div><small>SPELSTRÄCKA</small><b id="distance">0 m</b></div></div><footer>Trampa för att färdas genom landskapet. Högre effekt ger högre fart.<br>Spelsträckan är en enkel spelsimulering och skiljer sig från distansen på PM5. <button id="reset">Börja om</button></footer></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let power=0,distance=0,last=performance.now(),live=false;
document.querySelector('#reset').onclick=()=>distance=0;
async function poll(){try{const s=await fetch('/api/state').then(r=>r.json());live=s.connected&&Date.now()/1000-(s.last_sample||0)<5;power=live?Math.max(0,s.metrics.power_w||0):0;document.querySelector('#status').textContent=live?'● PM5 ansluten':s.status+' · väntar på livedata';document.querySelector('#watts').textContent=live?power+' W':'—';document.querySelector('#rpm').textContent=live&&s.metrics.cadence_rpm!==undefined?s.metrics.cadence_rpm+' rpm':'—';}catch(e){live=false;power=0;document.querySelector('#status').textContent='Ingen kontakt med BikeErg-bryggan'}setTimeout(poll,700)}poll();
function frame(t){const dt=Math.min((t-last)/1000,.1);last=t;distance+=Math.cbrt(power)*1.4*dt;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#213442';ctx.fillRect(0,0,w,h);ctx.fillStyle='#d6dfa1';ctx.beginPath();ctx.arc(w*.78,h*.20,32,0,Math.PI*2);ctx.fill();for(let layer=0;layer<3;layer++){ctx.fillStyle=['#344b54','#3c625a','#63826a'][layer];ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+4;x+=4){let y=h*(.48+layer*.12)+Math.sin((x+distance*(layer+1)*4)/ (150-layer*35))*35+Math.sin((x+distance*layer*3)/70)*12;ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.fill()}ctx.strokeStyle='#d9d4ac';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,h*.86);ctx.lineTo(w,h*.86);ctx.stroke();let x=w*.28,y=h*.86-14;ctx.strokeStyle='#172b32';ctx.lineWidth=4;for(let dx of [-23,23]){ctx.beginPath();ctx.arc(x+dx,y,15,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='#dcf5a6';ctx.beginPath();ctx.moveTo(x-23,y);ctx.lineTo(x-5,y-28);ctx.lineTo(x+10,y);ctx.lineTo(x-23,y);ctx.moveTo(x+10,y);ctx.lineTo(x+23,y-28);ctx.lineTo(x+28,y-28);ctx.stroke();document.querySelector('#distance').textContent=Math.floor(distance)+' m';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
